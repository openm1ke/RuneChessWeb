name: Deploy RuneChess to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The VK Games build first: both builds write dist/, and the site's
      # goes last so it is what dist/ holds. VK opens the game from
      # https://runechess.ru/vk/ (see tool/build-vk.sh).
      - run: npm run build:vk
      - run: npm run build
      - run: cp -R release-artifacts/runechess-vk dist/vk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
