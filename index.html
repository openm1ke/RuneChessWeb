<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Small, purpose-cut icons (2.5KB / 60KB) rather than the 1.5MB master
         artwork the branding source ships at — a favicon is only ever shown
         at a few dozen pixels. -->
    <link rel="icon" type="image/png" href="./assets/branding/favicon-32.png" />
    <link rel="apple-touch-icon" href="./assets/branding/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05091a" />
    <meta
      name="description"
      content="RuneChess — атмосферная шахматная головоломка. Расставляйте фигуры, активируйте руны-монеты и проходите 165 уровней."
    />
    <link rel="canonical" href="https://runechess.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RuneChess" />
    <meta property="og:title" content="RuneChess — шахматная головоломка" />
    <meta property="og:description" content="Расставляйте фигуры, активируйте руны-монеты и проходите 165 уровней." />
    <meta property="og:url" content="https://runechess.ru/" />
    <meta property="og:image" content="https://runechess.ru/assets/branding/runechess-logo.png" />
    <meta property="og:image:alt" content="Логотип RuneChess с шахматной королевой в магическом шаре" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "RuneChess",
        "url": "https://runechess.ru/",
        "image": "https://runechess.ru/assets/branding/runechess-logo.png",
        "description": "Шахматная головоломка: расставляйте фигуры, активируйте руны-монеты и проходите 165 уровней.",
        "inLanguage": "ru",
        "genre": ["Chess", "Puzzle"],
        "numberOfPlayers": "1"
      }
    </script>
    <link rel="stylesheet" href="./assets/fonts/fonts.css" />
    <style>
      html {
        background: #070b1c url(./assets/images/adaptive/menu-wide.webp) center / cover no-repeat;
      }
    </style>
    <title>RuneChess — шахматная головоломка</title>
    <!-- Yandex Games SDK — only inside a frame. The catalogue always runs
         the game in its own iframe; on runechess.ru the page is the top
         window, and the SDK loaded there throws "No parent to post message"
         several times a second for as long as the page is open. Written
         synchronously so `YaGames` exists before the app asks for it. The
         catalogue build swaps this for a plain script tag (vite.config.ts).
         See YANDEX_GAMES_PLATFORM_PLAN.md. -->
    <script id="yandex-games-sdk-loader">
      (function () {
        var framed;
        try { framed = window.self !== window.top; } catch (e) { framed = true; }
        if (framed) document.write('<script src="https://yandex.ru/games/sdk/v2"><\/script>');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
